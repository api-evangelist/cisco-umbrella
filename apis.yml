aid: cisco-umbrella
name: Cisco Umbrella
description: 'Cisco Umbrella, built on the OpenDNS platform Cisco acquired in 2015 and now part of Cisco Secure
  Access, is Cisco''s cloud-delivered security service: DNS-layer security, secure web gateway, cloud-delivered
  firewall, CASB and remote browser isolation. Cisco documents the Umbrella and Secure Access APIs under the Cloud
  Security section of DevNet, covering deployments, policies, reporting and threat intelligence investigation. No
  anonymously fetchable OpenAPI document is published: api.umbrella.com/openapi.json returns a real 404.'
