servers:
- url: https://api.umbrella.com/{basePath}
  variables:
    basePath:
      default: admin/v2
security:
- oauthFlow: []
tags:
- name: Contacts
paths:
  /config/contacts:
    get:
      tags:
      - Contacts
      description: List the contacts for the service providers console.
      summary: List Contacts
      operationId: getContacts
      security:
      - oauthFlow:
        - admin.config:read
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                type: array
                description: List the contacts for the service providers console.
                items:
                  $ref: '#/components/schemas/GetContact'
              example:
              - contactId: 1324455
                organizationId: 2345678
                contactType: billing
                primaryContact: 'no'
                firstName: my-firstname
                lastName: my-lastname
                createAt: 0
                modifiedAt: 0
                streetAddress: 123 Circle Court
                streetAddress2: Box 123
                city: San Jose
                state: CA
                zipCode: 12345a
                countryCode: '124'
                emailAddress: seller@cisco.com
                orgName: org name
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '500':
          $ref: '#/components/responses/500Error'
    post:
      tags:
      - Contacts
      description: Create a contact for the service providers console.
      summary: Create Contact
      operationId: createContact
      security:
      - oauthFlow:
        - admin.config:write
      requestBody:
        description: Add the contact information for service providers console.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContact'
            example:
              contactType: distributor
              emailAddress: my-contact@email.com
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContact'
              example:
                contactId: 1324455
                organizationId: 2345678
                contactType: billing
                primaryContact: 'no'
                firstName: my-firstname
                lastName: my-lastname
                createdAt: 0
                modifiedAt: 0
                streetAddress: 123 Circle Court
                streetAddress2: Box 123
                city: San Jose
                state: CA
                zipCode: 12345a
                countryCode: '124'
                emailAddress: seller@cisco.com
                orgName: org name
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '500':
          $ref: '#/components/responses/500Error'
  /config/contacts/{contactId}:
    get:
      tags:
      - Contacts
      description: Get a contact for the service providers console.
      summary: Get Contact
      operationId: getContact
      parameters:
      - $ref: '#/components/parameters/contactIdParam'
      security:
      - oauthFlow:
        - admin.config:read
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContact'
              example:
                contactId: 1324455
                organizationId: 2345678
                contactType: billing
                primaryContact: 'no'
                firstName: my-firstname
                lastName: my-lastname
                createdAt: 0
                modifiedAt: 0
                streetAddress: 123 Circle Court
                streetAddress2: Box 123
                city: San Jose
                state: CA
                zipCode: 12345a
                countryCode: '124'
                emailAddress: seller@cisco.com
                orgName: org name
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '500':
          $ref: '#/components/responses/500Error'
    put:
      tags:
      - Contacts
      description: Update a contact for service providers console.
      summary: Update Contact
      operationId: updateContact
      security:
      - oauthFlow:
        - admin.config:write
      requestBody:
        description: Add the contact information for the service providers console.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContact'
      parameters:
      - $ref: '#/components/parameters/contactIdParam'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContact'
              example:
                contactId: 1324455
                organizationId: 2345678
                contactType: billing
                primaryContact: 'no'
                firstName: my-firstname
                lastName: my-lastname
                createdAt: 0
                modifiedAt: 0
                streetAddress: 123 Circle Court
                streetAddress2: Box 123
                city: San Jose
                state: CA
                zipCode: 12345a
                countryCode: '124'
                emailAddress: seller@cisco.com
                orgName: org name
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '500':
          $ref: '#/components/responses/500Error'
    delete:
      tags:
      - Contacts
      description: Delete a contact for the service providers console.
      summary: Delete Contact
      operationId: deleteContact
      security:
      - oauthFlow:
        - admin.config:write
      parameters:
      - $ref: '#/components/parameters/contactIdParam'
      responses:
        '204':
          description: No Content
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
