openapi: 3.2.0
info:
  title: Cisco Umbrella Tagging Tags API
  version: 2.0.0
  description: Manage the tags and roaming computers with tags in the Umbrella organization.
  contact:
    name: Cloud Security Developer Community
  x-provenance:
    method: harvested
    authored_by: Cisco Umbrella
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    source_host: pubhub.devnetcloud.com
    note: 26 first-party OpenAPI 3.0 documents (256 operations) listed by Cisco's own docs-nav config and fetched anonymously. Byte-identity reconfirmed 2026-08-19 by SHA-256 against the live source.
  x-evidence:
  - type: source
    url: https://pubhub.devnetcloud.com/media/cloud-security-apis-in-eft/docs/umbrella-config.json
  - type: source
    url: https://developer.cisco.com/docs/cloud-security/
servers:
- url: https://api.umbrella.com/{basePath}
  variables:
    basePath:
      default: deployments/v2
security:
- oauthFlow: []
tags:
- name: Tags
  description: Manage the tags in the organization.
paths:
  /tags:
    get:
      description: List the tags in the organization.
      summary: Get Tags
      operationId: getTags
      tags:
      - Tags
      security:
      - oauthFlow:
        - deployments.tags:read
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tagInformation'
              example:
              - id: 67747
                organizationId: 3056800
                name: tag-two
                originsModifiedAt: '2022-04-12T23:20:50.52Z'
                createdAt: '2022-04-12T23:20:50.52Z'
                modifiedAt: '2022-04-12T23:20:50.52Z'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '500':
          $ref: '#/components/responses/500Error'
    post:
      description: Add a tag to the organization.
      summary: Add Tag
      operationId: createTag
      tags:
      - Tags
      security:
      - oauthFlow:
        - deployments.tags:write
      requestBody:
        $ref: '#/components/requestBodies/name'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tagInformation'
              example:
                id: 67747
                organizationId: 3056800
                name: test-tag-name
                originsModifiedAt: '2022-04-12T23:20:50.52Z'
                createdAt: '2022-04-12T23:20:50.52Z'
                modifiedAt: '2022-04-12T23:20:50.52Z'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '500':
          $ref: '#/components/responses/500Error'
components:
  headers:
    Content-Type:
      schema:
        type: string
      description: The MIME content type of the response body.
      example: application/json
    Date:
      schema:
        type: string
        pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
      description: The timestamp of the response.
      example: '2023-03-14T18:34:25Z'
  responses:
    403Error:
      description: Forbidden
      headers:
        Content-Type:
          $ref: '#/components/headers/Content-Type'
        Date:
          $ref: '#/components/headers/Date'
      content:
        application/json:
          schema:
            type: object
            properties:
              Error:
                type: string
    500Error:
      description: Internal Server Error
      headers:
        Content-Type:
          $ref: '#/components/headers/Content-Type'
        Date:
          $ref: '#/components/headers/Date'
      content:
        application/json:
          schema:
            type: object
            properties:
              Error:
                type: string
    401Error:
      description: Unauthorized
      headers:
        Content-Type:
          $ref: '#/components/headers/Content-Type'
        Date:
          $ref: '#/components/headers/Date'
      content:
        application/json:
          schema:
            type: object
            properties:
              Error:
                type: string
    404Error:
      description: Not Found
      headers:
        Content-Type:
          $ref: '#/components/headers/Content-Type'
        Date:
          $ref: '#/components/headers/Date'
      content:
        application/json:
          schema:
            type: object
            properties:
              Error:
                type: string
    400Error:
      description: Bad Request
      headers:
        Content-Type:
          $ref: '#/components/headers/Content-Type'
        Date:
          $ref: '#/components/headers/Date'
      content:
        application/json:
          schema:
            type: object
            properties:
              Error:
                type: string
  requestBodies:
    name:
      description: Add the tag to the devices in the organization.
      content:
        application/json:
          schema:
            type: object
            description: The name of the tag.
            required:
            - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 16
                description: The name of the tag.
                example: test-tag-name
          example:
            name: test-tag-name
  schemas:
    modifiedAt:
      type: string
      format: date-time
      description: 'The date and time (timestamp) that Umbrella updated the tag on the roaming computer.

        The timestamp is an ISO 8601 formatted string. For example: `2023-04-12T23:20:50.52Z`.'
      example: '2022-04-12T23:20:50.52Z'
    createdAt:
      type: string
      format: date-time
      description: 'The date and time (timestamp) that Umbrella added the tag to the roaming computer.

        The timestamp is an ISO 8601 formatted string. For example: `2023-04-12T23:20:50.52Z`.'
      example: '2022-04-12T23:20:50.52Z'
    organizationId:
      type: integer
      description: The organization ID.
      example: 2456789
    tagInformation:
      type: object
      description: The tag information for the device.
      required:
      - id
      - organizationId
      - name
      - originsModifiedAt
      - createdAt
      - modifiedAt
      properties:
        id:
          $ref: '#/components/schemas/id'
        organizationId:
          $ref: '#/components/schemas/organizationId'
        name:
          $ref: '#/components/schemas/name'
        originsModifiedAt:
          $ref: '#/components/schemas/originsModifiedAt'
        createdAt:
          $ref: '#/components/schemas/createdAt'
        modifiedAt:
          $ref: '#/components/schemas/modifiedAt'
      example:
        id: 12345
        organizationId: 567893
        name: tag-one
        originsModifiedAt: '2022-04-12T23:20:50.52Z'
        createdAt: '2022-04-12T23:20:50.52Z'
        modifiedAt: '2022-04-12T23:20:50.52Z'
    id:
      type: integer
      description: The unique ID of the tag.
      example: 12345678
    name:
      type: string
      description: The name of the tag.
      example: tag-one
    originsModifiedAt:
      type: string
      format: date-time
      description: 'The date and time (timestamp) that Umbrella modified the roaming computers.

        The timestamp is an ISO 8601 formatted string. For example: `2023-04-12T23:20:50.52Z`.'
      example: '2022-04-12T23:20:50.52Z'
  securitySchemes:
    oauthFlow:
      type: oauth2
      description: client credential flow
      flows:
        clientCredentials:
          tokenUrl: https://api.umbrella.com/auth/v2/token
          scopes:
            deployments.tags:read: Tags read access
            deployments.tags:write: Tags write access
            deployments.tagDevices:read: Tagged devices read access
            deployments.tagDevices:write: Tagged devices write access
