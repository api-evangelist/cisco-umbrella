          description: Specifies whether the request is part of a tenant control policy.
        port:
          type:
          - number
          - 'null'
          description: The port used to make the request.
        antivirusthreats:
          $ref: '#/components/schemas/AntivirusThreats'
        policy:
          $ref: '#/components/schemas/Policy'
        requestmethod:
