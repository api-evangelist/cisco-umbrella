          description: The response size in bytes.
        requestsize:
          type: number
          description: The response size in bytes.
        statuscode:
          type: number
          description: The HTTP status code (`200` or `201`).
          enum:
          - 200
          - 201
          example: 200
        useragent:
          type: string
          description: The name of the browser that made the request.
        referer:
          type: string
          description: The referring domain or URL.
        warnstatus:
