  callers to "check that your Umbrella package includes a license for the Umbrella API and its endpoints." The Investigate
  API is further tiered — Integration, Tier 1, Tier 2, Tier 3 — and the tier sets the rate limit, so entitlement
  is a runtime constraint, not just a billing one.
